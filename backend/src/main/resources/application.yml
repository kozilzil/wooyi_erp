server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: church-erp-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:church_erp}
    username: ${DB_USER:church}
    password: ${DB_PASSWORD:churchpass}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
